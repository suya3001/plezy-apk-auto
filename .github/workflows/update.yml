name: Plezy APK Auto Updater

on:
  schedule:
    # 매일 아침 6시, 밤 12시 실행 (한국시간 기준)
    - cron: '0 15,21 * * *'
  workflow_dispatch:

jobs:
  update-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 및 번역 패키지 설치
        run: |
          python3 -m pip install --upgrade pip
          pip install deep-translator

      - name: 최신버전 다운로드 및 한국어 릴리즈 노트 추출
        run: |
          # 1. 원본 API에서 최신 릴리즈 정보(JSON) 가져오기
          curl -s https://api.github.com/repos/edde746/plezy/releases/latest > release.json

          # 2. 버전명 추출
          VERSION=$(jq -r '.tag_name' release.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then VERSION="latest"; fi

          # 3. 영문 릴리즈 노트 추출 및 파이썬으로 한국어 번역
          jq -r '.body' release.json > raw_body.txt
          
          python3 -c "
          from deep_translator import GoogleTranslator
          import os

          try:
              with open('raw_body.txt', 'r', encoding='utf-8') as f:
                  text = f.read().strip()
              
              if text and text != 'null':
                  translated = GoogleTranslator(source='auto', target='ko').translate(text)
                  with open('translated_body.txt', 'w', encoding='utf-8') as f:
                      f.write(translated)
              else:
                  with open('translated_body.txt', 'w', encoding='utf-8') as f:
                      f.write('업데이트 상세 내역이 없습니다.')
          except Exception as e:
              with open('translated_body.txt', 'w', encoding='utf-8') as f:
                  f.write('릴리즈 노트 번역 중 오류가 발생했습니다.')
          "

          # 4. APK 파일 다운로드 URL 추출 및 압축 해제
          DOWNLOAD_URL=$(jq -r '.assets[] | select(.name | contains("arm64-v8a.tar.gz")) | .browser_download_url' release.json | head -n 1)
          wget $DOWNLOAD_URL -O plezy.tar.gz
          tar -xzvf plezy.tar.gz

          # 5. APK 파일명 변경 (버전 각인)
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          cp "$APK_PATH" "plezy_${VERSION}.apk"

          # 6. 환경변수에 저장
          echo "APK_FILE=plezy_${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 기존 릴리즈 삭제
        run: |
          gh release delete latest_apk --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 한국어 릴리즈 노트가 포함된 최신 APK 업로드
        run: |
          gh release create latest_apk "${{ env.APK_FILE }}" \
            --title "Plezy 최신버전 (${{ env.VERSION }})" \
            --notes-file translated_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
