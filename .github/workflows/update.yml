name: Plezy APK Auto Updater

on:
  schedule:
    # 매일 아침 6시, 밤 12시 실행 (한국시간 기준)
    - cron: '0 15,21 * * *'
  workflow_dispatch:

jobs:
  update-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 번역 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install deep-translator

      - name: 최신버전 다운로드 및 히스토리 한국어 번역 추출
        run: |
          # 1. 원본 API에서 최근 5개 릴리즈 정보(JSON) 가져오기
          curl -s "https://api.github.com/repos/edde746/plezy/releases?per_page=5" > releases.json

          # 2. 파이썬 스크립트로 최신버전 + 이전버전 히스토리 분할 번역 및 정리
          python3 -c "
          import json
          import time
          from deep_translator import GoogleTranslator

          translator = GoogleTranslator(source='auto', target='ko')

          def safe_translate(text):
              if not text or not text.strip():
                  return '내용 없음'
              
              lines = text.split('\n')
              translated_parts = []
              current_chunk = ''

              for line in lines:
                  # 1000자 단위로 문단을 분할하여 번역 요청
                  if len(current_chunk) + len(line) > 1000:
                      if current_chunk.strip():
                          try:
                              translated_parts.append(translator.translate(current_chunk.strip()))
                              time.sleep(0.4)
                          except Exception:
                              translated_parts.append(current_chunk.strip())
                      current_chunk = line + '\n'
                  else:
                      current_chunk += line + '\n'

              if current_chunk.strip():
                  try:
                      translated_parts.append(translator.translate(current_chunk.strip()))
                      time.sleep(0.4)
                  except Exception:
                      translated_parts.append(current_chunk.strip())

              return '\n'.join(translated_parts)

          with open('releases.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          if isinstance(data, list) and len(data) > 0:
              # 최신 버전 정보
              latest = data[0]
              version = latest.get('tag_name', 'latest')
              latest_body = latest.get('body', '')

              # APK 다운로드 URL 찾기
              download_url = ''
              for asset in latest.get('assets', []):
                  if 'arm64-v8a.tar.gz' in asset.get('name', ''):
                      download_url = asset.get('browser_download_url', '')
                      break
              if not download_url and latest.get('assets'):
                  download_url = latest['assets'][0].get('browser_download_url', '')

              # 릴리즈 본문 작성 (최신 버전)
              t_latest = safe_translate(latest_body)
              output = f'## 🚀 최신 버전 ({version}) 업데이트 내역\n\n{t_latest}\n\n'

              # 이전 버전 히스토리 작성 (최근 4개 추가)
              if len(data) > 1:
                  output += '---\n### 📜 지나간 버전 업데이트 히스토리\n\n'
                  for rel in data[1:]:
                      p_tag = rel.get('tag_name', '')
                      p_body = rel.get('body', '')
                      if p_tag:
                          t_prev = safe_translate(p_body)
                          output += f'<details>\n<summary><b>버전 {p_tag} 내역 보기 (클릭)</b></summary>\n\n{t_prev}\n\n</details>\n\n'

              with open('version.txt', 'w', encoding='utf-8') as f:
                  f.write(version)
              with open('download_url.txt', 'w', encoding='utf-8') as f:
                  f.write(download_url)
              with open('translated_body.txt', 'w', encoding='utf-8') as f:
                  f.write(output)
          "

          # 3. 환경변수 및 파일 다운로드 준비
          VERSION=$(cat version.txt)
          DOWNLOAD_URL=$(cat download_url.txt)

          wget $DOWNLOAD_URL -O plezy.tar.gz
          tar -xzvf plezy.tar.gz

          # 4. APK 파일명 변경 (버전 각인)
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          cp "$APK_PATH" "plezy_${VERSION}.apk"

          # 5. 환경변수에 저장
          echo "APK_FILE=plezy_${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 기존 릴리즈 삭제
        run: |
          gh release delete latest_apk --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 히스토리가 포함된 최신 APK 업로드
        run: |
          gh release create latest_apk "${{ env.APK_FILE }}" \
            --title "Plezy 최신버전 (${{ env.VERSION }})" \
            --notes-file translated_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
