# ==============================================================
# 🔐 공개 GitHub 저장소용: 이 YAML 파일 안에 API 키를 넣지 마세요.
# API 키는 GitHub 웹페이지에서 딱 한 번 등록하면 됩니다.
# 저장소 > Settings > Secrets and variables > Actions
# > New repository secret
# Name: GEMINI_API_KEY
# Secret: 발급받은 실제 API 키 붙여넣기 (따옴표 없이)
# > Add secret
# 이후 이 YAML은 수정할 필요가 없습니다.
# ==============================================================
name: Plezy APK Auto Updater

on:
  schedule:
    # 매일 아침 6시, 밤 12시 실행 (한국시간 기준)
    - cron: '0 15,21 * * *'
  workflow_dispatch:

jobs:
  update-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # deep-translator 설치 불필요: Python 표준 라이브러리로 공식 API 호출
      - name: 최신버전 다운로드 및 히스토리 한국어 번역 추출
        env:
          # 🔒 위 GitHub Secret을 자동으로 읽습니다. 여기에 직접 키를 쓰지 마세요.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 원본 API에서 최근 5개 릴리즈 정보(JSON) 가져오기
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-max-time 120 \
            --connect-timeout 15 --max-time 45 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --write-out 'GitHub releases HTTP %{http_code}\n' \
            --output releases.json \
            "https://api.github.com/repos/edde746/plezy/releases?per_page=5"

          # 2. 공식 Gemini 무료 API로 릴리즈 노트를 한 번에 번역, 결과 검증
          python3 - <<'PYTHON'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          MODEL = 'gemini-3.1-flash-lite'
          API_URL = f'https://generativelanguage.googleapis.com/v1beta/models/{MODEL}:generateContent'

          def fail(message):
              print(f'::error::{message}', file=sys.stderr)
              raise SystemExit(1)

          api_key = os.getenv('GEMINI_API_KEY', '').strip()

          try:
              data = json.loads(Path('releases.json').read_text(encoding='utf-8'))
          except (OSError, ValueError) as exc:
              fail(f'릴리즈 정보 읽기 실패: {exc}')

          if not isinstance(data, list) or not data:
              fail('GitHub 릴리즈 목록이 비어 있거나 잘못된 응답입니다.')

          # 최신 릴리즈 + 이전 릴리즈 최대 4개의 본문만 번역
          releases = data[:5]
          contents = {}
          for i, release in enumerate(releases):
              if i and not release.get('tag_name'):
                  continue
              body = (release.get('body') or '').strip()
              if body:
                  contents[i] = body

          translated = {}
          translation_fallback = False
          if contents:
              schema = {
                  'type': 'OBJECT',
                  'properties': {
                      'translations': {
                          'type': 'ARRAY',
                          'items': {
                              'type': 'OBJECT',
                              'properties': {
                                  'id': {'type': 'INTEGER'},
                                  'text': {'type': 'STRING'},
                              },
                              'required': ['id', 'text'],
                          },
                      },
                  },
                  'required': ['translations'],
              }
              instructions = (
                  'Translate the following release notes from English into fluent Korean. '
                  'Return one translation for each input id, keeping the id unchanged. '
                  'Do not summarize, omit, explain, or add content. '
                  'Preserve Markdown structure (headings, lists, newlines), fenced/inline code, '
                  'HTML tags, all URLs, file names, commands, version numbers, and proper names. '
                  'Translate normal English prose, including headings, into Korean. '
                  'If an input consists solely of non-translatable technical tokens, copy them. '
                  'Return only structured JSON matching the specified schema.'
              )
              items = [{'id': i, 'text': text} for i, text in contents.items()]
              payload = {
                  'contents': [{
                      'role': 'user',
                      'parts': [{'text': instructions + '\n\n' + json.dumps(items, ensure_ascii=False)}],
                  }],
                  'generationConfig': {
                      'temperature': 0,
                      'maxOutputTokens': 32768,
                      'responseMimeType': 'application/json',
                      'responseSchema': schema,
                      'thinkingConfig': {'thinkingLevel': 'minimal'},
                  },
              }
              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload, ensure_ascii=False).encode('utf-8'),
                  headers={
                      'Content-Type': 'application/json',
                      'x-goog-api-key': api_key,
                  },
                  method='POST',
              )
              def translation_fail(message):
                  raise ValueError(message)

              # 최초 요청 + 재시도 1회. 응답 파싱/검증 실패도 재시도 대상입니다.
              for attempt in range(2):
                  attempt_translated = {}
                  try:
                      if not api_key:
                          translation_fail('GEMINI_API_KEY가 없습니다.')
                      try:
                          with urllib.request.urlopen(request, timeout=120) as res:
                              api_data = json.load(res)
                      except urllib.error.HTTPError as exc:
                          # 키나 입력 본문 등 민감한 데이터는 로그에 노출하지 않음
                          translation_fail(f'Gemini 번역 API HTTP {exc.code}. 키, 무료 할당량, 모델 접근 권한 확인 필요.')
                      except (urllib.error.URLError, TimeoutError, OSError, ValueError) as exc:
                          translation_fail(f'Gemini 번역 API 통신/응답 오류: {type(exc).__name__}')

                      try:
                          candidate = api_data['candidates'][0]
                          if candidate.get('finishReason') != 'STOP':
                              translation_fail(f"번역이 정상 완료되지 않았습니다: {candidate.get('finishReason')}")
                          raw = ''.join(part.get('text', '') for part in candidate['content']['parts'])
                          result = json.loads(raw)['translations']
                      except (KeyError, IndexError, TypeError, ValueError) as exc:
                          translation_fail(f'번역 응답 JSON 파싱 실패: {type(exc).__name__}')

                      if not isinstance(result, list) or len(result) != len(contents):
                          translation_fail('번역 항목 수가 원문과 다릅니다.')
                      for item in result:
                          if not isinstance(item, dict):
                              translation_fail('번역 항목 형식이 올바르지 않습니다.')
                          idx, ko = item.get('id'), item.get('text')
                          if type(idx) is not int or idx not in contents or idx in attempt_translated:
                              translation_fail('번역 ID 누락, 중복 또는 불일치가 발생했습니다.')
                          if not isinstance(ko, str) or not ko.strip():
                              translation_fail(f'번역 ID {idx}: 결과가 비어 있습니다.')
                          ko = ko.strip()
                          source = contents[idx]
                          # 코드/링크/URL만 있는 메모에는 한국어가 없어도 정상일 수 있음
                          prose = re.sub(r'```.*?```|`[^`]*`|https?://\S+', '', source, flags=re.S)
                          needs_ko = bool(re.search(r'[A-Za-z]{3,}', prose))
                          if needs_ko and ko == source:
                              translation_fail(f'번역 ID {idx}: 영문 원문이 그대로 반환됐습니다.')
                          if needs_ko and not re.search(r'[가-힣]', ko):
                              translation_fail(f'번역 ID {idx}: 한국어 번역을 확인할 수 없습니다.')
                          for url in re.findall(r'https?://[^\s)>]+', source):
                              if url not in ko:
                                  translation_fail(f'번역 ID {idx}: 원문의 URL이 누락/변경됐습니다.')
                          if source.count('```') != ko.count('```'):
                              translation_fail(f'번역 ID {idx}: Markdown 코드 블록이 변형됐습니다.')
                          attempt_translated[idx] = ko
                      if set(attempt_translated) != set(contents):
                          translation_fail('번역 결과 일부가 누락됐습니다.')

                      translated = attempt_translated
                      break
                  except (ValueError, KeyError, IndexError, TypeError, OSError) as exc:
                      if attempt == 0 and api_key:
                          print(f'::warning::번역 첫 시도 실패: {exc}. 5초 후 1회 재시도합니다.')
                          time.sleep(5)
                      else:
                          print(f'::warning::번역 실패: {exc}. 원문으로 APK 배포를 계속합니다.')
                          translated = dict(contents)
                          translation_fallback = True
                          break

          latest = releases[0]
          version = latest.get('tag_name', 'latest')
          # 기존 APK 다운로드 URL 선택 로직은 변경하지 않음
          download_url = ''
          for asset in latest.get('assets', []):
              if 'arm64-v8a.tar.gz' in asset.get('name', ''):
                  download_url = asset.get('browser_download_url', '')
                  break
          if not download_url and latest.get('assets'):
              download_url = latest['assets'][0].get('browser_download_url', '')

          t_latest = translated.get(0, '내용 없음')
          direct_apk_link = f'https://github.com/suya3001/plezy-apk-auto/releases/download/latest_apk/plezy_{version}.apk'
          output = f'### 📥 [{version} APK 파일 바로 다운로드받기]({direct_apk_link})\n\n---\n\n## 🚀 최신 버전 ({version}) 업데이트 내역\n\n{t_latest}\n\n'

          if translation_fallback:
              output = '> 한국어 번역에 실패하여 릴리즈 노트를 원문으로 제공합니다. APK는 최신 버전입니다.\n\n' + output

          if len(releases) > 1:
              output += '---\n### 📜 지나간 버전 업데이트 히스토리\n\n'
              for i, rel in enumerate(releases[1:], start=1):
                  p_tag = rel.get('tag_name', '')
                  if p_tag:
                      t_prev = translated.get(i, '내용 없음')
                      output += f'<details>\n<summary><b>버전 {p_tag} 내역 보기 (클릭)</b></summary>\n\n{t_prev}\n\n</details>\n\n'

          # 검증된 번역 또는 원문 폴백으로 배포 파일을 작성
          Path('version.txt').write_text(version, encoding='utf-8')
          Path('download_url.txt').write_text(download_url, encoding='utf-8')
          Path('translated_body.txt').write_text(output, encoding='utf-8')
          mode = '원문 폴백' if translation_fallback else '한국어 번역'
          print(f'릴리즈 노트 준비 완료 ({mode}): {len(contents)}개 본문, 버전 {version}')
          PYTHON

          # 3. 환경변수 및 파일 다운로드 준비
          VERSION=$(cat version.txt)
          DOWNLOAD_URL=$(cat download_url.txt)

          wget $DOWNLOAD_URL -O plezy.tar.gz
          tar -xzvf plezy.tar.gz

          # 4. APK 파일명 변경 (버전 각인)
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          cp "$APK_PATH" "plezy_${VERSION}.apk"

          # 5. 환경변수에 저장
          echo "APK_FILE=plezy_${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: 기존 릴리즈 삭제
        run: |
          gh release delete latest_apk --cleanup-tag -y || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 상단 다운로드 링크가 포함된 최신 APK 업로드
        run: |
          gh release create latest_apk "${{ env.APK_FILE }}" \
            --title "Plezy 최신버전 (${{ env.VERSION }})" \
            --notes-file translated_body.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
